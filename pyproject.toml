[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "early-warning"
version = "0.5.0"
description = "Early Warning Decision Engine for Customer Negative Reviews (Olist Capstone)"
authors = [
    { name = "Shayan Ganji", email = "shayan.ganji@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "requests>=2.31.0",
    "lightgbm>=4.0.0",
    "mlflow>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/Shayan-Ganji"
Documentation = "https://github.com/Shayan-Ganji/stage-4-capstone"
Repository = "https://github.com/Shayan-Ganji/stage-4-capstone"

[project.scripts]
early-warning = "early_warning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
